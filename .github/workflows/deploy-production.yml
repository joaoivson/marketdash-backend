name: Deploy to Production

# O build da imagem acontece AQUI, no runner do GitHub. O VPS só puxa.
#
# Por quê: o Coolify construía a imagem dentro do servidor que serve produção
# (4 vCPU, compartilhado com homologação, WAHA, dois Redis, Traefik e o próprio
# Coolify). Em 11/09/2026 cinco `docker build` simultâneos levaram a CPU a
# 100%, a Hostinger aplicou teto de 20% e a API ficou ~20h inalcançável. Em
# 16/09, ainda sob o teto, uma tentativa de deploy deixou a máquina com load 32
# e steal de 94% por 40 minutos — no início do expediente.
#
# Agora: Actions constrói e publica no GHCR; o Coolify recebe uma tag e dá
# `docker pull`. Segundos de rede no lugar de 5-10 minutos de CPU.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
      - 'README.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'SHA já publicado no GHCR (rollback ou redeploy). Vazio = constrói este commit.'
        required: false
        default: ''

# Não é mais o grupo compartilhado `coolify-build-vps`: aquele existia para
# impedir dois builds simultâneos NO VPS, e não há mais build no VPS. Este
# grupo só evita dois deploys de produção se atropelarem.
concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGEM_API: ghcr.io/joaoivson/marketdash-backend
  IMAGEM_WORKER: ghcr.io/joaoivson/marketdash-backend-worker

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Duplicata do Finder ("campaign 2.py") não é importável e ainda quebrava
      # o py_compile abaixo com um "No such file or directory" enigmático.
      # Falha aqui com o nome do arquivo na cara.
      - name: Check for duplicate/invalid Python filenames
        run: |
          dups=$(find . -type f -name "*.py" -not -path "./.git/*" -name "* *")
          if [ -n "$dups" ]; then
            echo "❌ Arquivos .py com espaço no nome (provável duplicata do Finder):"
            echo "$dups"
            exit 1
          fi

      - name: Validate Python syntax
        run: |
          find . -type f -name "*.py" -not -path "./.git/*" -not -path "*/__pycache__/*" -print0 | xargs -0 python -m py_compile

      - name: Validate imports
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          JWT_SECRET: "test-secret-key-for-validation-only-min-32-chars"
        run: |
          python -c "import app; import app.main; import app.core.config; import app.core.security"

  build:
    name: Build e publicar imagens
    runs-on: ubuntu-latest
    needs: validate
    # Com `tag` preenchido a imagem já existe no GHCR: é rollback ou redeploy,
    # e reconstruir seria justamente perder a garantia de estar subindo o mesmo
    # artefato que já rodou antes.
    if: ${{ inputs.tag == '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # As duas imagens saem do MESMO Dockerfile e compartilham o stage `base`.
      # Mesmo `scope` de cache nos dois passos: o segundo build reaproveita as
      # camadas de dependências do primeiro e leva segundos.
      #
      # `provenance: false` evita os manifests "unknown/unknown" que o buildx
      # publica por padrão e que só confundem a listagem de pacotes.
      - name: Build e push da API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGEM_API }}:${{ github.sha }}
            ${{ env.IMAGEM_API }}:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build e push do worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGEM_WORKER }}:${{ github.sha }}
            ${{ env.IMAGEM_WORKER }}:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy em produção
    runs-on: ubuntu-latest
    needs: [validate, build]
    # `build` é pulado no caminho de rollback — `always()` + checagem explícita
    # é o que deixa o deploy seguir nesse caso sem aceitar um build quebrado.
    if: |
      always()
      && needs.validate.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')

    # Gate de aprovação: a imagem é construída e publicada sozinha, mas a troca
    # do container em PRODUÇÃO espera um clique. Pedido do João em 16/09, no
    # dia em que um deploy automático tornou produção inutilizável às 7h40.
    environment: production

    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TAG: ${{ inputs.tag || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy da API
        run: |
          chmod +x .github/scripts/deploy-imagem.sh
          .github/scripts/deploy-imagem.sh api \
            "${{ secrets.COOLIFY_DEPLOY_URL_BACKEND_PROD }}" \
            "$IMAGEM_API" "$TAG"

      # A prova de que o código novo está no ar. Sem isto, "deployment
      # finished" é só o Coolify falando de si mesmo.
      - name: Confirmar a versão no ar
        run: |
          chmod +x .github/scripts/confirmar-versao.sh
          .github/scripts/confirmar-versao.sh https://api.marketdash.com.br/health "$TAG"

      # O worker é OUTRO recurso no Coolify. Sem passo próprio ele fica com o
      # código de quando foi subido à mão enquanto o CI reporta verde — foi o
      # que aconteceu entre 29/07 e 02/08/2026.
      - name: Deploy do worker Celery
        run: |
          .github/scripts/deploy-imagem.sh worker \
            "${{ secrets.COOLIFY_DEPLOY_URL_WORKER_PROD }}" \
            "$IMAGEM_WORKER" "$TAG"

      - name: Resumo
        run: |
          echo "✅ API e worker de produção em $TAG"
          echo "Rollback: Actions → Deploy to Production → Run workflow → tag = <sha anterior>"
