name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'README.md'

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          find . -type f -name "*.py" -not -path "./.git/*" -not -path "./__pycache__/*" | xargs python -m py_compile

      - name: Validate imports
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          JWT_SECRET: "test-secret-key-for-validation-only-min-32-chars"
        run: |
          python -c "import app; import app.main; import app.core.config; import app.core.security"

      - name: Check for common issues
        run: |
          python -c "import sys; sys.exit(0)" || exit 1

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Coolify deployment (API)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x .github/scripts/trigger-deploy.sh
          .github/scripts/trigger-deploy.sh api "${{ secrets.COOLIFY_DEPLOY_URL_BACKEND_PROD }}"

      # O worker roda as tasks Celery (sync Shopee/Facebook, processamento de CSV)
      # a partir de um Dockerfile.worker próprio — é OUTRO recurso no Coolify.
      # Sem este passo ele fica com o código de quando foi subido à mão, enquanto
      # o CI reporta deploy verde. Foi o que aconteceu entre 29/07 e 02/08/2026.
      - name: Trigger Coolify deployment (Celery worker)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          .github/scripts/trigger-deploy.sh worker "${{ secrets.COOLIFY_DEPLOY_URL_WORKER_PROD }}"

      - name: Deployment status
        run: |
          echo "✅ API + worker atualizados em produção (branch main)"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"