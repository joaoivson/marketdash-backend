name: Deploy to Homologation

# Gêmeo do deploy-production.yml, com duas diferenças de propósito:
#   - sem gate de aprovação (homologação é para testar, e travar aqui só
#     ensinaria a ignorar o gate de produção);
#   - três recursos em vez de dois (o worker dedicado ao envio em grupos só
#     existe em hml).
#
# O build da imagem acontece no runner. Ver o cabeçalho do deploy-production.yml
# para o porquê.

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
      - 'README.md'
  # Mudança de variável de ambiente no Coolify não reinicia o container
  # sozinho: o disparo manual é como se aplica sem precisar de commit vazio.
  workflow_dispatch:
    inputs:
      tag:
        description: 'SHA já publicado no GHCR (rollback ou redeploy). Vazio = constrói este commit.'
        required: false
        default: ''

concurrency:
  group: deploy-backend-hml
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGEM_API: ghcr.io/joaoivson/marketdash-backend
  IMAGEM_WORKER: ghcr.io/joaoivson/marketdash-backend-worker

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for duplicate/invalid Python filenames
        run: |
          dups=$(find . -type f -name "*.py" -not -path "./.git/*" -name "* *")
          if [ -n "$dups" ]; then
            echo "❌ Arquivos .py com espaço no nome (provável duplicata do Finder):"
            echo "$dups"
            exit 1
          fi

      - name: Validate Python syntax
        run: |
          find . -type f -name "*.py" -not -path "./.git/*" -not -path "*/__pycache__/*" -print0 | xargs -0 python -m py_compile

      - name: Validate imports
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          JWT_SECRET: "test-secret-key-for-validation-only-min-32-chars"
        run: |
          python -c "import app; import app.main; import app.core.config; import app.core.security"

  build:
    name: Build e publicar imagens
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.tag == '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mesmo `scope` de cache que produção: as camadas de dependências são as
      # mesmas, então um deploy de hml esquenta o cache do de prod e vice-versa.
      - name: Build e push da API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGEM_API }}:${{ github.sha }}
            ${{ env.IMAGEM_API }}:develop
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build e push do worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGEM_WORKER }}:${{ github.sha }}
            ${{ env.IMAGEM_WORKER }}:develop
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    name: Deploy em homologação
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: |
      always()
      && needs.validate.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')

    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TAG: ${{ inputs.tag || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy da API
        run: |
          chmod +x .github/scripts/deploy-imagem.sh
          .github/scripts/deploy-imagem.sh api \
            "${{ secrets.COOLIFY_DEPLOY_URL_BACKEND_HML }}" \
            "$IMAGEM_API" "$TAG"

      - name: Confirmar a versão no ar
        run: |
          chmod +x .github/scripts/confirmar-versao.sh
          .github/scripts/confirmar-versao.sh https://api.hml.marketdash.com.br/health "$TAG"

      - name: Deploy do worker Celery
        run: |
          .github/scripts/deploy-imagem.sh worker \
            "${{ secrets.COOLIFY_DEPLOY_URL_WORKER_HML }}" \
            "$IMAGEM_WORKER" "$TAG"

      # Worker DEDICADO à fila de envio em grupos. Mesma imagem do worker comum
      # (só muda a env CELERY_PAPEL), mas é um terceiro recurso no Coolify e
      # precisa do próprio deploy: worker de envio com código velho manda
      # mensagem com a lógica errada, o que é pior que um deploy vermelho.
      - name: Deploy do worker de WhatsApp
        run: |
          .github/scripts/deploy-imagem.sh worker-whatsapp \
            "${{ secrets.COOLIFY_DEPLOY_URL_WORKER_WHATSAPP_HML }}" \
            "$IMAGEM_WORKER" "$TAG"

      - name: Resumo
        run: |
          echo "✅ API e workers de homologação em $TAG"
