name: Deploy to Homologation

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
      - 'README.md'
  # Redeploy sob demanda. Mudança de variável de ambiente no Coolify não
  # reinicia o container sozinho, e sem este gatilho a única forma de aplicar
  # era um commit vazio só para acordar o CI.
  workflow_dispatch:

# Homologação e produção compartilham o MESMO VPS de 4 vCPU, e o Coolify
# constrói as imagens ali mesmo. Em 11/09/2026 `develop` e `main` foram
# empurradas com 21 segundos de diferença: dois `docker build` simultâneos
# levaram a CPU a 100%, a Hostinger ativou a limitação e a API de produção
# ficou ~20h inalcançável.
#
# Grupo IGUAL nos dois workflows de propósito — é isso que faz um esperar o
# outro em vez de os dois construírem juntos. `cancel-in-progress: false`
# porque um deploy já disparado não pode ser abortado no meio.
concurrency:
  group: coolify-build-vps
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Duplicata do Finder ("campaign 2.py") não é importável e ainda quebrava
      # o py_compile abaixo com um "No such file or directory" enigmático.
      # Falha aqui com o nome do arquivo na cara.
      - name: Check for duplicate/invalid Python filenames
        run: |
          dups=$(find . -type f -name "*.py" -not -path "./.git/*" -name "* *")
          if [ -n "$dups" ]; then
            echo "❌ Arquivos .py com espaço no nome (provável duplicata do Finder):"
            echo "$dups"
            exit 1
          fi

      - name: Validate Python syntax
        run: |
          find . -type f -name "*.py" -not -path "./.git/*" -not -path "*/__pycache__/*" -print0 | xargs -0 python -m py_compile

      - name: Validate imports
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          JWT_SECRET: "test-secret-key-for-validation-only-min-32-chars"
        run: |
          python -c "import app; import app.main; import app.core.config; import app.core.security"

      - name: Check for common issues
        run: |
          python -c "import sys; sys.exit(0)" || exit 1

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Coolify deployment (API)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x .github/scripts/trigger-deploy.sh
          .github/scripts/trigger-deploy.sh api "${{ secrets.COOLIFY_DEPLOY_URL_BACKEND_HML }}"

      # Ver comentário no deploy-production.yml: o worker Celery é um recurso
      # separado no Coolify e precisa do próprio disparo.
      - name: Trigger Coolify deployment (Celery worker)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          .github/scripts/trigger-deploy.sh worker "${{ secrets.COOLIFY_DEPLOY_URL_WORKER_HML }}"

      # Worker DEDICADO à fila de envio em grupos (celery-whatsapp-hml). É um
      # terceiro recurso no Coolify e, como os outros dois, precisa do próprio
      # disparo — recurso sem passo de deploy é exatamente como o Celery rodou
      # código de semanas atrás com o CI todo verde.
      #
      # Falha alto igual aos dois de cima (secret cadastrado em 01/09/2026): um
      # worker de envio com código velho manda mensagem com a lógica errada, o
      # que é pior que um deploy vermelho.
      - name: Trigger Coolify deployment (worker WhatsApp)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          .github/scripts/trigger-deploy.sh worker-whatsapp "${{ secrets.COOLIFY_DEPLOY_URL_WORKER_WHATSAPP_HML }}"


      # Segura o lock de concurrency até o build REALMENTE terminar. Sem isto o
      # job acaba em segundos (o webhook é assíncrono), o lock é liberado antes
      # do build começar e a serialização acima não vale nada.
      - name: Aguardar a fila de builds do Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x .github/scripts/aguardar-build.sh
          .github/scripts/aguardar-build.sh "${{ secrets.COOLIFY_DEPLOY_URL_BACKEND_HML }}"

      - name: Deployment status
        run: |
          echo "✅ API + workers atualizados em homologação (branch develop)"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
