name: Deploy to Homologation

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'README.md'
  # Redeploy sob demanda. Mudança de variável de ambiente no Coolify não
  # reinicia o container sozinho, e sem este gatilho a única forma de aplicar
  # era um commit vazio só para acordar o CI.
  workflow_dispatch:

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Duplicata do Finder ("campaign 2.py") não é importável e ainda quebrava
      # o py_compile abaixo com um "No such file or directory" enigmático.
      # Falha aqui com o nome do arquivo na cara.
      - name: Check for duplicate/invalid Python filenames
        run: |
          dups=$(find . -type f -name "*.py" -not -path "./.git/*" -name "* *")
          if [ -n "$dups" ]; then
            echo "❌ Arquivos .py com espaço no nome (provável duplicata do Finder):"
            echo "$dups"
            exit 1
          fi

      - name: Validate Python syntax
        run: |
          find . -type f -name "*.py" -not -path "./.git/*" -not -path "*/__pycache__/*" -print0 | xargs -0 python -m py_compile

      - name: Validate imports
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          JWT_SECRET: "test-secret-key-for-validation-only-min-32-chars"
        run: |
          python -c "import app; import app.main; import app.core.config; import app.core.security"

      - name: Check for common issues
        run: |
          python -c "import sys; sys.exit(0)" || exit 1

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Coolify deployment (API)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x .github/scripts/trigger-deploy.sh
          .github/scripts/trigger-deploy.sh api "${{ secrets.COOLIFY_DEPLOY_URL_BACKEND_HML }}"

      # Ver comentário no deploy-production.yml: o worker Celery é um recurso
      # separado no Coolify e precisa do próprio disparo.
      - name: Trigger Coolify deployment (Celery worker)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          .github/scripts/trigger-deploy.sh worker "${{ secrets.COOLIFY_DEPLOY_URL_WORKER_HML }}"

      # Worker DEDICADO à fila de envio em grupos (celery-whatsapp-hml). É um
      # terceiro recurso no Coolify e, como os outros dois, precisa do próprio
      # disparo — recurso sem passo de deploy é exatamente como o Celery rodou
      # código de semanas atrás com o CI todo verde.
      #
      # ⚠️ Enquanto o secret não existir, este passo AVISA e segue. Assim que
      # ele for cadastrado, troque o bloco por uma chamada direta ao
      # trigger-deploy.sh (que falha alto), igual aos dois de cima: o estado
      # "avisa e segue" é aceitável para estrear, não para conviver.
      - name: Trigger Coolify deployment (worker WhatsApp)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          URL_WORKER_WHATSAPP: ${{ secrets.COOLIFY_DEPLOY_URL_WORKER_WHATSAPP_HML }}
        run: |
          if [ -z "$URL_WORKER_WHATSAPP" ]; then
            echo "::warning title=worker-whatsapp NÃO foi atualizado::O secret COOLIFY_DEPLOY_URL_WORKER_WHATSAPP_HML não está cadastrado. O worker dedicado de envio continua com o código do último deploy manual. Cadastre o secret para que ele acompanhe a develop."
            exit 0
          fi
          .github/scripts/trigger-deploy.sh worker-whatsapp "$URL_WORKER_WHATSAPP"

      - name: Deployment status
        run: |
          echo "✅ API + workers atualizados em homologação (branch develop)"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
