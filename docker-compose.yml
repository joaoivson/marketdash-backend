services:
  db:
    image: postgres:15-alpine
    container_name: marketdash_db
    environment:
      POSTGRES_USER: dashads_user
      POSTGRES_PASSWORD: dashads_password
      POSTGRES_DB: dashads_db
    ports:
      # Host 5434 para evitar conflito com outro Postgres local (ex.: outro projeto na 5432).
      # O app usa Supabase remoto; este db local só é dependência do compose.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dashads_user -d dashads_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: marketdash_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "db.iprdyorxqdiivthtcvxf.supabase.co:2600:1f1e:75b:4b02:93eb:9b99:8237:adb3"
    volumes:
      - .:/app
      - upload_temp_data:/app/uploads
      - ../feature-flags.json:/app/feature-flags.json:ro
    ports:
      - "8000:8000"
    environment:
      # LOCAL PostgreSQL (desenvolvimento)
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: marketdash-secret-dev-32chars
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-marketdash_local}
      # Upload de arquivos grandes: grava em disco e envia só o caminho ao Celery
      UPLOAD_TEMP_DIR: /app/uploads
      USE_JOBS_PIPELINE: "true"
      S3_BUCKET: marketDash_bucket
      S3_ENDPOINT: https://rsejwvxealraianensoz.storage.supabase.co/storage/v1/s3
      S3_ACCESS_KEY: b66c95e91947d71dc6c85880b59aafd3
      S3_SECRET_KEY: 88f15f3f87f9f415b6980d277dd1d7b42a89e61e7e6d1d04a063901520f3b673
      S3_REGION: us-east-2
      SHOPEE_ENCRYPTION_KEY: ${SHOPEE_ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      # Facebook Ads (preencher no .env do backend). Vazio = endpoints /facebook retornam 503.
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_API_VERSION: ${FACEBOOK_API_VERSION:-v25.0}
      FACEBOOK_OAUTH_REDIRECT_URI: ${FACEBOOK_OAUTH_REDIRECT_URI:-}
      FACEBOOK_OAUTH_CONFIG_ID: ${FACEBOOK_OAUTH_CONFIG_ID:-}
      # WhatsApp via WAHA (perfil `whatsapp` do compose). Host `waha` resolve
      # na rede do compose; sem o serviço de pé, as rotas respondem 503/502.
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-chave-local-de-desenvolvimento}
      WAHA_SESSAO_RESUMO: ${WAHA_SESSAO_RESUMO:-mkdlocalresumo}
      WAHA_WEBHOOK_TOKEN: ${WAHA_WEBHOOK_TOKEN:-token-local-de-desenvolvimento}
      WAHA_WEBHOOK_URL: ${WAHA_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: marketdash_redis
    ports:
      # Host 6380 para evitar conflito com outro Redis local. App/worker usam redis:6379 na rede interna.
      - "6380:6379"
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-marketdash_local}", "--appendonly", "yes" ]

  worker:
    build: .
    container_name: marketdash_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - upload_temp_data:/app/uploads
      - ../feature-flags.json:/app/feature-flags.json:ro
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-marketdash_local}
      UPLOAD_TEMP_DIR: /app/uploads
      USE_JOBS_PIPELINE: "true"
      S3_BUCKET: marketDash_bucket
      S3_ENDPOINT: https://rsejwvxealraianensoz.storage.supabase.co/storage/v1/s3
      S3_ACCESS_KEY: b66c95e91947d71dc6c85880b59aafd3
      S3_SECRET_KEY: 88f15f3f87f9f415b6980d277dd1d7b42a89e61e7e6d1d04a063901520f3b673
      S3_REGION: us-east-2
      SHOPEE_ENCRYPTION_KEY: ${SHOPEE_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # NOTE: serviço `beat` removido — agendamento agora é via pg_cron + pg_net no Supabase
  # (migration 018). pg_cron chama POST /api/v1/internal/cron/shopee-sync às 10h UTC (7h BRT).

  # MinIO for jobs pipeline (USE_JOBS_PIPELINE). Create bucket "uploads" in Console (http://localhost:9000).
  minio:
    image: minio/minio:latest
    container_name: marketdash_minio
    command: server /data
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # Evolution API para desenvolver o resumo diário no WhatsApp sem depender do
  # servidor de homologação. Em hml/produção ela roda como recurso próprio no
  # WAHA (WhatsApp HTTP API) — substituiu a Evolution em 25/08.
  # Ver docs/whatsapp-waha.md.
  #
  # Perfil `whatsapp`: não sobe no `docker-compose up` padrão, porque conectar
  # um número aqui e outro no Coolify na MESMA sessão derruba a conexão dos
  # dois. Suba de propósito:  docker compose --profile whatsapp up waha
  waha:
    # Tag `arm` para Mac M-series (a `latest` é amd64-only); no Coolify
    # (amd64) usar devlikeapro/waha:latest — ver docs/whatsapp-waha.md.
    image: devlikeapro/waha:arm
    container_name: marketdash_waha
    profiles: ["whatsapp"]
    ports:
      - "3001:3000"
    environment:
      # Engine GOWS (whatsmeow/Go): ~60MB por sessão — é o que torna o cap de
      # 60 sessões viável em ~4GB. Fallback: NOWEB (payloads podem diferir).
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: chave-local-de-desenvolvimento
      WAHA_LOG_LEVEL: warn
      # Sessões sobrevivem a restart pelo volume; em produção usar Postgres
      # (WHATSAPP_SESSIONS_POSTGRESQL_URL) — ver runbook.
      WAHA_PRINT_QR: "false"
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  waha_sessions:
  postgres_data:
  upload_temp_data:
  minio_data:
